
name: Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-24.04

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;4.1.2 ndk;30.0.16248370"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      # Install ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      # Cache previously compiled C++ files
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-ndk30.0.16248370-api28-arm64-v8a-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk30.0.16248370-api28-arm64-v8a-

      # Cache CMake configuration, FetchContent sources and native build outputs
      - name: Cache native CMake build
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: native-${{ runner.os }}-ndk30.0.16248370-cmake4.1.2-api28-arm64-v8a-release-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', 'app/build.gradle.kts') }}

      # Reset statistics without deleting cached compilation results
      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Show ccache statistics
        run: ccache --show-stats

      - name: Collect unstripped native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-native-libs
          mapfile -d '' native_libraries < <(find app -type f -name '*.so' -print0)
          if [ "${#native_libraries[@]}" -eq 0 ]; then
            echo "No native shared libraries found under app/."
            exit 1
          fi
          for library in "${native_libraries[@]}"; do
            mkdir -p "diagnostic-native-libs/$(dirname "$library")"
            cp "$library" "diagnostic-native-libs/$library"
            echo "Collected: $library"
          done

      - name: Upload native diagnostic libraries
        uses: actions/upload-artifact@v7
        with:
          name: maze-game-native-diagnostic-libs
          path: diagnostic-native-libs/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: maze-game-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14